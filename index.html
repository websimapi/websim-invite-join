<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invite Join</title>
  <link href="https://fonts.googleapis.com/css2?family=Caladea&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{"imports":{"nipplejs":"https://esm.sh/nipplejs@0.9.0"}}</script>

<body>
  <!-- loader -->
  <div id="loader" role="status" aria-hidden="false"><div class="loader-card"><div class="spinner" aria-hidden="true"></div><div class="loader-text">Loading MemeForge…</div></div></div>

  <div id="app">
    <!-- left navigation panel -->
    <nav id="left-nav" aria-label="Main navigation">
      <div class="nav-logo">
        <button class="logo-btn" aria-label="Logo">
          <img src="/asset_logo.png" alt="Family Forge logo" />
        </button>
      </div>
      <div class="nav-top">
        <button class="nav-btn" aria-label="Home"><span class="material-icons-outlined" aria-hidden="true">home</span></button>
        <button class="nav-btn" aria-label="Search"><span class="material-icons-outlined" aria-hidden="true">search</span></button>
        <button class="nav-btn" aria-label="Notifications"><span class="material-icons-outlined" aria-hidden="true">notifications</span></button>
      </div>
      <div class="nav-center">
        <button class="pfp" aria-label="User profile">U</button>
      </div>
      <div class="nav-bottom">
        <button class="more" aria-label="More">…</button>
      </div>
    </nav>

    <div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="invite-title">
      <div class="card">
        <h1 id="invite-title">Meet MemeForge</h1>
        <p class="subtitle">Turn your ideas into a reality with motion and sound instantly!</p>
        <div id="not-found-msg" class="notice">You need an invite code to join</div>

        <div class="field row">
          <div class="invite-code-row" aria-label="Invite code">
            <input class="invite-box" id="invite-0" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/><input class="invite-box" id="invite-1" type="text" inputmode="numeric" maxlength="1"/><input class="invite-box" id="invite-2" type="text" inputmode="numeric" maxlength="1"/><input class="invite-box" id="invite-3" type="text" inputmode="numeric" maxlength="1"/><input class="invite-box" id="invite-4" type="text" inputmode="numeric" maxlength="1"/><input class="invite-box" id="invite-5" type="text" inputmode="numeric" maxlength="1"/><input class="invite-box" id="invite-6" type="text" inputmode="numeric" maxlength="1"/><input class="invite-box" id="invite-7" type="text" inputmode="numeric" maxlength="1"/>
          </div>
        </div>

        <div class="field row"><input id="display-name" type="text" maxlength="32" placeholder="Pick a display name"/></div>

        <div class="actions"><button id="join-btn" class="btn" disabled>Join</button></div>
        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </div>

    <main id="main-content"></main>
  </div>
  <script src="app.js" type="module"></script>
