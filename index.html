<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invite Join</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caladea&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">

<body>
  <!-- ...existing content... -->
  <div id="app">
    <div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="invite-title">
      <div class="card">
        <canvas id="stars" aria-hidden="true"></canvas>
        <h1 id="invite-title">Meet Clippie</h1>
        <p class="subtitle">Turn your ideas into with motion and sound instantly!</p>

        <div id="not-found-msg" class="notice">You need an invite code to join</div>

        <label class="field">
          <div class="label-text">Invite code</div>
          <input id="invite-input" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter invite code" />
        </label>

        <label class="field">
          <div class="label-text">Display name</div>
          <input id="display-name" type="text" maxlength="32" placeholder="Pick a display name" />
        </label>

        <div class="actions">
          <button id="join-btn" class="btn" disabled>Join</button>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </div>
    </div>

    <!-- app content placeholder -->
    <main id="main-content">
      <!-- ...existing content... -->
      <h2>Welcome</h2>
      <p>Your app content goes here.</p>
      <!-- ...existing content... -->
    </main>
  </div>
  <script src="app.js" type="module"></script>
